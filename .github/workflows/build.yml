name: Build

on:
  push:
    branches: ['main', 'claude/*']
    tags: ['v*']
  pull_request:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: write

env:
  QT_VERSION: '6.11.3'

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libgl1-mesa-dev libegl-dev libvulkan-dev \
            libxkbcommon-dev libxkbcommon-x11-0 libxcb-cursor0 libnss3 libfontconfig1
      - name: Install Qt ${{ env.QT_VERSION }}
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: qtwebengine qtwebchannel qtpositioning qtshadertools qtpdf
          dir: ${{ github.workspace }}/.qt-ci
          cache: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: QMAKE="$QT_ROOT_DIR/bin/qmake" cargo test --locked
      - name: Build .deb (bundles Qt)
        run: QMAKE="$QT_ROOT_DIR/bin/qmake" ./scripts/build-deb.sh
      - uses: actions/upload-artifact@v4
        with:
          name: oynix-deb
          path: target/deb/*.deb
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: target/deb/*.deb
