name: Build

on:
  push:
    branches: ['main', 'claude/*']
    tags: ['v*']
  pull_request:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt 6 and Vulkan
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-base-dev qt6-base-dev-tools qt6-declarative-dev \
            qt6-webengine-dev qt6-webengine-dev-tools qml6-module-qtwebengine \
            qml6-module-qtquick qml6-module-qtquick-controls qml6-module-qtquick-layouts \
            qml6-module-qtquick-window qml6-module-qtquick-shapes qml6-module-qtquick-dialogs \
            qml6-module-qtquick-templates qml6-module-qtqml-workerscript qml6-module-qtcore libvulkan-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --locked
      - name: Build .deb
        run: ./scripts/build-deb.sh
      - uses: actions/upload-artifact@v4
        with:
          name: oynix-deb
          path: target/deb/*.deb
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: target/deb/*.deb
