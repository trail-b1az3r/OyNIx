name: Build

# Every push / PR builds the .deb and the pacman package as artifacts.
# A GitHub release is published when:
#   • you run this workflow manually (Actions › Build › Run workflow) and
#     enter a version, e.g. 5.1.0  → release "v5.1.0" at the selected commit;
#   • or you push a tag like v5.1.0.

on:
  push:
    branches: ['main', 'claude/*']
    tags: ['v*']
  pull_request:
    branches: ['main']
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 5.1.0). Leave empty to build without releasing.'
        required: false
        default: ''
      prerelease:
        description: 'Mark the release as a pre-release'
        type: boolean
        default: false
      draft:
        description: 'Create the release as a draft'
        type: boolean
        default: false

permissions:
  contents: write

env:
  QT_VERSION: '6.11.3'

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.ver.outputs.version }}
      release: ${{ steps.ver.outputs.release }}
    steps:
      - uses: actions/checkout@v4

      - name: Work out the version
        id: ver
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          CARGO_VERSION=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ -n "$INPUT_VERSION" ]; then
            V="${INPUT_VERSION#v}"; RELEASE=true
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            V="${GITHUB_REF#refs/tags/v}"; RELEASE=true
          else
            V="$CARGO_VERSION"; RELEASE=false
          fi
          if ! [[ "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+.][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Version '$V' is not like 1.2.3 or 1.2.3-beta.1"; exit 1
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "release=$RELEASE" >> "$GITHUB_OUTPUT"
          echo "Building OyNIx $V (release: $RELEASE)"

      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libgl1-mesa-dev libegl-dev libvulkan-dev \
            libxkbcommon-dev libxkbcommon-x11-0 libxcb-cursor0 libnss3 libfontconfig1 \
            libarchive-tools zstd

      - name: Install Qt ${{ env.QT_VERSION }}
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: qtwebengine qtwebchannel qtpositioning qtshadertools qtpdf
          dir: ${{ github.workspace }}/.qt-ci
          cache: true

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: QMAKE="$QT_ROOT_DIR/bin/qmake" cargo test --locked

      - name: Build .deb (Debian / Ubuntu / Mint)
        run: QMAKE="$QT_ROOT_DIR/bin/qmake" ./scripts/build-deb.sh "${{ steps.ver.outputs.version }}"

      - name: Build .pkg.tar.zst (Arch / Manjaro / EndeavourOS)
        run: QMAKE="$QT_ROOT_DIR/bin/qmake" ./scripts/build-pkg.sh "${{ steps.ver.outputs.version }}"

      - name: Checksums
        run: |
          mkdir -p dist
          cp target/deb/*.deb target/pkg/*.pkg.tar.zst dist/
          (cd dist && sha256sum * > SHA256SUMS)
          cat dist/SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: oynix-${{ steps.ver.outputs.version }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    if: needs.build.outputs.release == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: oynix-${{ needs.build.outputs.version }}
          path: dist

      - name: Publish GitHub release v${{ needs.build.outputs.version }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.build.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: OyNIx ${{ needs.build.outputs.version }}
          prerelease: ${{ inputs.prerelease || contains(needs.build.outputs.version, '-') }}
          draft: ${{ inputs.draft || false }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            ## Install

            **Debian / Ubuntu / Mint**
            ```bash
            sudo apt install ./oynix_${{ needs.build.outputs.version }}_amd64.deb
            ```

            **Arch / Manjaro / EndeavourOS**
            ```bash
            sudo pacman -U oynix-*-x86_64.pkg.tar.zst
            ```

            Both packages include their own Qt ${{ env.QT_VERSION }} runtime under `/usr/lib/oynix`.
            Verify downloads with `sha256sum -c SHA256SUMS`.
          files: dist/*
