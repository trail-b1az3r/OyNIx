<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- OyNIx icon: two overlapping translucent discs form a lens around a
       bright focal point, on a rounded tile. Original artwork for OyNIx. -->
  <defs>
    <linearGradient id="tile" x1="64" y1="40" x2="448" y2="472" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3a2fd6"/>
      <stop offset="0.55" stop-color="#2463d8"/>
      <stop offset="1" stop-color="#0fb59b"/>
    </linearGradient>
    <radialGradient id="glow" cx="256" cy="256" r="120" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="tileClip"><rect x="32" y="32" width="448" height="448" rx="132"/></clipPath>
  </defs>
  <rect x="32" y="32" width="448" height="448" rx="132" fill="url(#tile)"/>
  <g clip-path="url(#tileClip)">
    <!-- soft light sweep across the tile -->
    <path d="M32 300 C 160 220, 330 380, 480 250 L480 480 L32 480 Z" fill="#ffffff" opacity="0.07"/>
  </g>
  <g transform="rotate(-24 256 256)">
    <circle cx="206" cy="256" r="118" fill="#ffffff" fill-opacity="0.22" stroke="#ffffff" stroke-opacity="0.9" stroke-width="22"/>
    <circle cx="306" cy="256" r="118" fill="#ffffff" fill-opacity="0.22" stroke="#ffffff" stroke-opacity="0.9" stroke-width="22"/>
  </g>
  <circle cx="256" cy="256" r="110" fill="url(#glow)" opacity="0.55"/>
  <circle cx="256" cy="256" r="34" fill="#ffffff"/>
  <circle cx="256" cy="256" r="14" fill="#2463d8"/>
</svg>
