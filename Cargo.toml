[package]
name = "oynix"
version = "5.0.0"
edition = "2021"
rust-version = "1.80"
license = "MIT"
description = "OyNIx — a fast, private, native WebKit-style desktop browser built with Rust, QML and Qt Quick (Vulkan 1.2/1.3 or OpenGL ES)"
repository = "https://github.com/trail-b1az3r/OyNIx"
readme = "README.md"
build = "build.rs"

[[bin]]
name = "oynix"
path = "src/main.rs"

[dependencies]
cxx = "1.0"
cxx-qt = "0.10"
cxx-qt-lib = { version = "0.10", features = ["qt_gui", "qt_qml"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
ash = { version = "0.38", default-features = false, features = ["loaded", "debug"] }

[build-dependencies]
cxx-qt-build = "0.10"
qt-build-utils = "0.10"

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
