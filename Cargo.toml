[package]
name = "oynix"
version = "5.3.1"
edition = "2021"
rust-version = "1.80"
license = "MIT"
description = "OyNIx — a fast, private, native WebKit-style desktop browser built with Rust, QML and Qt Quick (Vulkan 1.2/1.3 or OpenGL ES)"
repository = "https://github.com/trail-b1az3r/OyNIx"
readme = "README.md"
build = "build.rs"

[[bin]]
name = "oynix"
path = "src/main.rs"

[dependencies]
cxx = "1.0"
cxx-qt = "0.10"
cxx-qt-lib = { version = "0.10", features = ["qt_gui", "qt_qml"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
ash = { version = "0.38", default-features = false, features = ["loaded", "debug"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
aho-corasick = "1"
rusb = { version = "0.9", features = ["vendored"] }
oxc = { version = "0.158", features = ["transformer", "codegen", "semantic"] }
ureq = { version = "3", default-features = false, features = ["rustls", "platform-verifier"] }
sha2 = "0.11"
ring = "0.17"
ocrs = { version = "0.14", default-features = false }
rten = { version = "0.28", default-features = false, features = ["onnx_format"] }
image = { version = "0.25", default-features = false, features = ["png"] }
lopdf = { version = "0.36", default-features = false }
aes = "0.8"
cbc = "0.1"
des = "0.8"
sha1 = "0.10"
base64 = "0.23.1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
pulldown-cmark = { version = "0.13.6", default-features = false, features = ["html"] }
sha3 = "0.10"

[build-dependencies]
cxx-qt-build = "0.10"
qt-build-utils = "0.10"

[profile.release]
lto = "thin"
codegen-units = 4
strip = true

# OCR is unusably slow without optimisation; keep it fast in debug builds too.
[profile.dev.package.rten]
opt-level = 3
[profile.dev.package.rten-tensor]
opt-level = 3
[profile.dev.package.rten-vecmath]
opt-level = 3
[profile.dev.package.rten-simd]
opt-level = 3
[profile.dev.package.rten-gemm]
opt-level = 3
[profile.dev.package.ocrs]
opt-level = 3
